services:
  # Serviço do Banco de Dados MySQL
  db:
    image: mysql:8.0
    container_name: conectaeventos_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: conectaeventos
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - conecta_network

  # Serviço da Aplicação Web ConectaEventos (Tomcat 9)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: conectaeventos_app
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: conectaeventos
      DB_USER: root
      DB_PASS: root
    depends_on:
      db:
        condition: service_healthy
    networks:
      - conecta_network

volumes:
  db_data:
    driver: local

networks:
  conecta_network:
    driver: bridge
